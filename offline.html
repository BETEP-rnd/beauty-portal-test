<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f8f2ec">
<title>Нет сети — Мастерфолио</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f8f2ec; color: #2b1a1a; font-family: "Manrope", "Segoe UI", system-ui, sans-serif; }
  .card { width: min(100%, 440px); padding: 32px 28px; border: 1px solid #d9c3b8; border-radius: 16px; background: #fffaf6; text-align: center; }
  .mark { width: 56px; height: 56px; margin: 0 auto 18px; border-radius: 16px; display: grid; place-items: center; background: #6e1f2e; color: #fff; font-family: Georgia, serif; font-size: 32px; font-weight: 600; }
  h1 { margin: 0 0 10px; font-family: Georgia, "Times New Roman", serif; font-size: 34px; font-weight: 500; }
  p { margin: 0 0 22px; color: #7d6a63; line-height: 1.55; }
  a { display: inline-block; padding: 11px 20px; border-radius: 99px; background: #6e1f2e; color: #fff; text-decoration: none; font-size: 14px; }
</style>
</head>
<body>
  <main class="card">
    <div class="mark">М</div>
    <h1>Нет соединения</h1>
    <p>Страница не загрузилась. Проверьте интернет и попробуйте снова.</p>
    <a href="./">Открыть Мастерфолио</a>
  </main>
</body>
</html>
